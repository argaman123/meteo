@if (visible()) {
  <div
    class="pointer-events-none fixed end-3 top-15 z-50 rounded-md border bg-background/70 backdrop-blur-lg px-2 py-1 text-xs tabular-nums shadow-[0_0_8px_rgb(0_0_0/0.45)]"
  >
    <div dir="ltr" class="text-end">
      {{ fps() }} fps
      @if (heapMb() !== null) {
        · {{ heapMb() }} MB
      }
    </div>
    @if (layerTimes().length) {
      <div class="mt-1 flex flex-col gap-0.5 border-t pt-1">
        @for (line of layerTimes(); track line.name) {
          <div [class.opacity-50]="!line.relevant">{{ line.name }} · {{ line.time }}</div>
        }
      </div>
    }
  </div>
}
