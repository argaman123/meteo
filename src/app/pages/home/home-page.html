<div class="relative h-full">
  <div #mapContainer class="h-full w-full"></div>
  <div
    class="absolute end-3 top-3 flex flex-col gap-2 rounded-md border border-panel-border bg-panel/90 p-2"
  >
    @for (item of map.basemaps; track item.id) {
      <button
        class="rounded px-2 py-1 text-sm"
        [class.bg-accent]="map.basemap() === item.id"
        [class.text-app]="map.basemap() === item.id"
        (click)="map.setBasemap(item.id)"
      >
        {{ item.label }}
      </button>
    }
  </div>
  <app-layer-bar class="absolute inset-y-0 start-0" />
  <app-time-bar class="absolute bottom-3 start-48 end-3" />
</div>
