<div class="relative h-full bg-card">
  <div class="absolute top-12 bottom-14.5 start-48 end-0 overflow-hidden rounded-xl">
    <div #mapContainer class="h-full w-full"></div>
    <div class="pointer-events-none absolute inset-0 rounded-xl border border-white/10 shadow-[inset_0_0_12px_rgb(0_0_0/0.35)]"></div>
  </div>
  <header class="absolute inset-x-0 top-0 flex h-12 items-center gap-2 bg-card px-4">
    <span class="text-lg font-bold tracking-tight">מטאו</span>
    <span class="text-xs font-medium tracking-[0.25em] text-muted-foreground uppercase">Meteo</span>
    <ng-template #basemapMenu>
      <hlm-dropdown-menu>
        @for (item of map.basemaps; track item.id) {
          <button hlmDropdownMenuRadio class="relative mt-1 h-11 w-44 overflow-hidden first:mt-0"
                  [checked]="map.basemap() === item.id"
                  [keepOpen]="false" (triggered)="map.setBasemap(item.id)">
            <img [src]="'/basemaps/thumbnails/' + item.id + '.png'" alt=""
                 class="absolute inset-0 h-full w-full object-cover">
            <span class="absolute inset-0 bg-linear-to-l from-background/90 from-25% to-background/15"></span>
            <span class="relative flex items-center gap-1.5 font-medium">
              <hlm-dropdown-menu-radio-indicator class="static"/>
              {{ item.label }}
            </span>
          </button>
        }
      </hlm-dropdown-menu>
    </ng-template>
    <button hlmBtn size="sm" class="ms-auto w-9 px-0" aria-label="קואורדינטות"
            hlmTooltip="קואורדינטות" position="bottom"
            [variant]="layers.isLayerActive(coordinates) ? 'default' : 'secondary'"
            [attr.aria-pressed]="layers.isLayerActive(coordinates)"
            [hlmDropdownMenuTrigger]="coordinatesMenu">
      <ng-icon name="lucideCrosshair"/>
    </button>
    <ng-template #coordinatesMenu>
      <hlm-dropdown-menu>
        <button hlmDropdownMenuRadio [checked]="!layers.isLayerActive(coordinates)"
                [keepOpen]="false" (triggered)="layers.hideLayer(coordinates)">
          <hlm-dropdown-menu-radio-indicator/>
          כבוי
        </button>
        @for (choice of coordinates.format.choices; track choice.value) {
          <button hlmDropdownMenuRadio
                  [checked]="layers.isLayerActive(coordinates) && coordinates.format() === choice.value"
                  [keepOpen]="false"
                  (triggered)="layers.isLayerActive(coordinates) || layers.showLayer(coordinates); coordinates.format.set(choice.value)">
            <hlm-dropdown-menu-radio-indicator/>
            {{ choice.label }}
          </button>
        }
      </hlm-dropdown-menu>
    </ng-template>
    <button hlmBtn variant="secondary" size="sm" class="w-9 px-0" aria-label="מפת רקע"
            hlmTooltip="מפת רקע" position="bottom"
            [hlmDropdownMenuTrigger]="basemapMenu">
      <ng-icon name="lucidePalette"/>
    </button>
    <button hlmBtn size="sm" class="w-9 px-0" aria-label="חיווי ביצועים"
            hlmTooltip="חיווי ביצועים (Ctrl+Alt+P)" position="bottom"
            [variant]="perfHud()?.visible() ? 'default' : 'ghost'"
            [attr.aria-pressed]="perfHud()?.visible()"
            (click)="perfHud()?.toggle()">
      <ng-icon name="lucideActivity"/>
    </button>
  </header>
  <app-legend-bar class="absolute bottom-18 end-3" />
  <app-level-bar class="absolute start-51 top-15" />
  <app-layer-bar class="absolute start-0 top-12 bottom-14.5" />
  <app-time-bar class="absolute inset-x-0 bottom-0" />
  <app-hover-readout />
  <app-perf-hud />
</div>
