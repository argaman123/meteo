<div
  class="relative h-full bg-card"
  [style.--time-bar-height]="timeBarHeight()"
  [style.--sounding-table-width]="soundingTableWidth()"
>
  <div
    class="absolute top-12 bottom-(--time-bar-height) start-48 end-(--sounding-table-width) overflow-hidden rounded-xl"
  >
    <app-point-menu>
      <div #mapContainer class="h-full w-full"></div>
    </app-point-menu>
    <div
      class="pointer-events-none absolute inset-0 rounded-xl border border-white/10 shadow-[inset_0_0_12px_rgb(0_0_0/0.35)]"
    ></div>
  </div>
  <app-top-bar class="absolute inset-x-0 top-0" [perfHud]="perfHud" />
  <app-legend-bar
    class="absolute end-[calc(var(--sounding-table-width)+0.75rem)] bottom-[calc(var(--time-bar-height)+0.875rem)]"
  />
  <app-level-bar class="absolute start-51 top-15" />
  <app-time-bar #timeBar class="absolute inset-x-0 bottom-0">
    <app-meteogram />
  </app-time-bar>
  <app-layer-bar class="absolute start-0 top-12 bottom-14.5" />
  <app-sounding-table class="absolute end-0 top-12 bottom-(--time-bar-height)" />
  <app-hover-readout />
  <app-perf-hud #perfHud />
</div>
