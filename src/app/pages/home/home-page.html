<div class="relative h-full">
  <div #mapContainer class="h-full w-full"></div>
  <div
    class="absolute end-3 top-3 flex flex-col gap-1 rounded-xl border bg-card/75 backdrop-blur-md p-1 shadow-lg"
  >
    @for (item of map.basemaps; track item.id) {
      <button
        hlmBtn
        size="sm"
        [variant]="map.basemap() === item.id ? 'default' : 'ghost'"
        [attr.aria-pressed]="map.basemap() === item.id"
        (click)="map.setBasemap(item.id)"
      >
        {{ item.label }}
      </button>
    }
  </div>
  <app-layer-bar class="absolute start-3 top-3" />
  <app-time-bar class="absolute inset-x-3 bottom-3 mx-auto block max-w-2xl" />
</div>
