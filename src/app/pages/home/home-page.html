<div
  class="relative h-full bg-card"
  [style.--time-bar-height]="timeBarHeight()"
  [style.--sounding-table-width]="soundingTableWidth()"
>
  <div
    class="absolute top-12 bottom-(--time-bar-height) start-48 end-(--sounding-table-width) overflow-hidden rounded-xl"
  >
    <app-point-menu>
      <div #mapContainer class="h-full w-full"></div>
    </app-point-menu>
    <div
      class="pointer-events-none absolute inset-0 rounded-xl border border-white/10 shadow-[inset_0_0_12px_rgb(0_0_0/0.35)]"
    ></div>
  </div>
  <header class="absolute inset-x-0 top-0 flex h-12 items-center gap-2 bg-card px-4">
    <span class="text-lg font-bold tracking-tight">מטאו</span>
    <span class="text-xs font-medium tracking-[0.25em] text-muted-foreground uppercase">Meteo</span>
    <ng-template #basemapMenu>
      <hlm-dropdown-menu>
        @for (item of map.basemaps; track item.id) {
          <button
            hlmDropdownMenuRadio
            class="relative mt-1 h-11 w-44 overflow-hidden first:mt-0"
            [checked]="map.basemap() === item.id"
            [keepOpen]="false"
            (triggered)="map.setBasemap(item.id)"
          >
            <img
              [src]="'/basemaps/thumbnails/' + item.id + '.png'"
              alt=""
              class="absolute inset-0 h-full w-full object-cover"
            />
            <span
              class="absolute inset-0 bg-linear-to-l from-background/90 from-25% to-background/15"
            ></span>
            <span class="relative flex items-center gap-1.5 font-medium">
              <hlm-dropdown-menu-radio-indicator class="static" />
              {{ item.label }}
            </span>
          </button>
        }
      </hlm-dropdown-menu>
    </ng-template>
    <button
      hlmBtn
      variant="secondary"
      size="sm"
      class="ms-auto w-9 px-0"
      aria-label="מפת רקע"
      hlmTooltip="מפת רקע"
      position="bottom"
      [hlmDropdownMenuTrigger]="basemapMenu"
    >
      <ng-icon name="lucidePalette" />
    </button>
    <app-settings-panel />
    <button
      hlmBtn
      size="sm"
      class="w-9 px-0"
      aria-label="חיווי ביצועים"
      [variant]="perfHud()?.visible() ? 'default' : 'ghost'"
      [attr.aria-pressed]="perfHud()?.visible()"
      (click)="perfHud()?.toggle()"
    >
      <ng-icon name="lucideActivity" />
    </button>
  </header>
  <app-legend-bar
    class="absolute end-[calc(var(--sounding-table-width)+0.75rem)] bottom-[calc(var(--time-bar-height)+0.875rem)]"
  />
  <app-level-bar class="absolute start-51 top-15" />
  <app-time-bar #timeBar class="absolute inset-x-0 bottom-0">
    <app-meteogram />
  </app-time-bar>
  <app-layer-bar class="absolute start-0 top-12 bottom-14.5" />
  <app-sounding-table class="absolute end-0 top-12 bottom-(--time-bar-height)" />
  <app-hover-readout />
  <app-perf-hud />
</div>
