<div
  class="flex h-full w-44 flex-col gap-2 border-s border-panel-border bg-panel/90 p-3 text-sm"
>
  <h2 class="font-medium">שכבות</h2>
  @for (row of rows(); track row.state.id) {
    <button
      class="rounded px-2 py-1 text-start"
      [class.bg-accent]="row.state.active"
      [class.text-app]="row.state.active"
      (click)="store.toggle(row.state.id)"
    >
      {{ row.entry.label }}
    </button>
  }
  <button
    class="mt-auto rounded border border-panel-border px-2 py-1"
    [class.bg-accent]="store.hoverReadoutEnabled()"
    [class.text-app]="store.hoverReadoutEnabled()"
    (click)="store.toggleHoverReadout()"
  >
    קריאת ערכים
  </button>
</div>
