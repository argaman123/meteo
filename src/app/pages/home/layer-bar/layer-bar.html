<div class="flex w-44 flex-col gap-1 rounded-xl border bg-card/75 backdrop-blur-md p-1.5 shadow-lg">
  <h2 class="px-2 py-1 text-xs font-medium text-muted-foreground">שכבות</h2>
  @for (entry of menu; track entry.layer) {
    <button
      hlmBtn
      size="sm"
      class="justify-start"
      [variant]="service.isLayerShown(entry.layer) ? 'default' : 'ghost'"
      [attr.aria-pressed]="service.isLayerShown(entry.layer)"
      (click)="service.toggleLayer(entry.layer)"
    >
      {{ entry.name }}
    </button>
  }
</div>
