<hlm-popover class="contents" align="end">
  <button hlmPopoverTrigger hlmBtn variant="secondary" size="sm" class="w-9 px-0" aria-label="הגדרות">
    <ng-icon name="lucideSettings"/>
  </button>
  <hlm-popover-content *hlmPopoverPortal
                       class="w-56 gap-0 rounded-xl border bg-background/70 p-2 ring-0 shadow-[0_0_12px_rgb(0_0_0/0.45)] backdrop-blur-lg">
    <h2 class="px-1 pb-1 text-[11px] font-semibold tracking-wider text-muted-foreground/70">יחידות</h2>
    @for (control of units; track control) {
      <div class="flex items-center gap-2 px-1 py-1 text-sm">
        <span class="grow">{{ control.label }}</span>
        <div dir="ltr" class="flex gap-1">
          @for (choice of control.choices; track choice.value) {
            <button hlmBtn size="sm" class="h-6 px-2 text-xs"
                    [variant]="choice.value === control() ? 'default' : 'ghost'"
                    [attr.aria-pressed]="choice.value === control()"
                    (click)="control.set(choice.value)">
              {{ choice.label }}
            </button>
          }
        </div>
      </div>
    }
    <div class="flex items-center gap-2 px-1 py-1 text-sm">
      <span class="grow">קואורדינטות</span>
      <div dir="ltr" class="flex gap-1">
        <button hlmBtn size="sm" class="h-6 px-2 text-xs"
                [variant]="!layersService.isLayerActive(coordinates) ? 'default' : 'ghost'"
                [attr.aria-pressed]="!layersService.isLayerActive(coordinates)"
                (click)="layersService.hideLayer(coordinates)">
          כבוי
        </button>
        @for (choice of coordinateFormat.choices; track choice.value) {
          <button hlmBtn size="sm" class="h-6 px-2 text-xs"
                  [variant]="layersService.isLayerActive(coordinates) && coordinateFormat() === choice.value ? 'default' : 'ghost'"
                  [attr.aria-pressed]="layersService.isLayerActive(coordinates) && coordinateFormat() === choice.value"
                  (click)="layersService.isLayerActive(coordinates) || layersService.showLayer(coordinates); coordinateFormat.set(choice.value)">
            {{ choice.label }}
          </button>
        }
      </div>
    </div>
  </hlm-popover-content>
</hlm-popover>
