<div class="relative flex items-center gap-2 bg-card pt-1.5">
  <div dir="ltr" class="grid shrink-0 grid-cols-4 gap-x-1 gap-y-1 px-2">
    <button hlmBtn variant="ghost" size="sm" class="h-6 px-1.5 text-xs" aria-label="אחורה 3 שעות"
            (click)="time.jumpBy(-3)">
      <ng-icon name="lucideChevronsLeft"/>3h
    </button>
    <button hlmBtn variant="ghost" size="sm" class="h-6 px-1" aria-label="מפה קודמת"
            (click)="time.stepBack()">
      <ng-icon name="lucideChevronLeft"/>
    </button>
    <button hlmBtn variant="ghost" size="sm" class="h-6 px-1" aria-label="מפה הבאה"
            (click)="time.stepForward()">
      <ng-icon name="lucideChevronRight"/>
    </button>
    <button hlmBtn variant="ghost" size="sm" class="h-6 px-1.5 text-xs" aria-label="קדימה 3 שעות"
            (click)="time.jumpBy(3)">
      3h<ng-icon name="lucideChevronsRight"/>
    </button>
    <button hlmBtn variant="ghost" size="sm" class="col-span-2 h-6 px-1.5 text-xs" aria-label="אחורה 24 שעות"
            (click)="time.jumpBy(-24)">
      <ng-icon name="lucideChevronsLeft"/>24h
    </button>
    <button hlmBtn variant="ghost" size="sm" class="col-span-2 h-6 px-1.5 text-xs" aria-label="קדימה 24 שעות"
            (click)="time.jumpBy(24)">
      24h<ng-icon name="lucideChevronsRight"/>
    </button>
  </div>
  @if (player.loopTime() !== null) {
    <div dir="ltr"
         class="absolute bottom-full start-1/2 mb-17 flex -translate-x-1/2 items-center gap-0.5 rounded-xl border bg-background/70 p-0.5 shadow-[0_0_12px_rgb(0_0_0/0.45)] backdrop-blur-lg">
      <button hlmBtn variant="ghost" size="sm" class="h-6 w-6 px-0" aria-label="תמונה קודמת"
              (click)="player.stepFrame(-1)">
        <ng-icon name="lucideSkipBack"/>
      </button>
      <button hlmBtn variant="ghost" size="sm" class="h-6 w-6 px-0"
              [attr.aria-label]="player.playing() ? 'השהיה' : 'ניגון'"
              (click)="player.playing() ? player.pause() : player.play()">
        <ng-icon [name]="player.playing() ? 'lucidePause' : 'lucidePlay'"/>
      </button>
      <button hlmBtn variant="ghost" size="sm" class="h-6 w-6 px-0" aria-label="תמונה הבאה"
              (click)="player.stepFrame(1)">
        <ng-icon name="lucideSkipForward"/>
      </button>
      <button hlmBtn variant="ghost" size="sm" class="h-6 min-w-8 px-1 text-xs tabular-nums"
              aria-label="מהירות" (click)="cycleSpeed()">
        ×{{ player.speed() }}
      </button>
    </div>
  }
  <div class="relative flex-1">
    <div dir="ltr" class="relative h-12 cursor-grab overflow-hidden select-none active:cursor-grabbing"
         (wheel)="onWheel($event)" (pointerdown)="onPointerDown($event)"
         (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
         (pointercancel)="onPointerUp($event)">
      <div class="absolute top-5 bottom-0 bg-orange-500/35" [style.left.%]="pastBand().left"
           [style.width.%]="pastBand().width"></div>
      <div class="absolute top-5 bottom-0 bg-sky-500/35" [style.left.%]="futureBand().left"
           [style.width.%]="futureBand().width"></div>
      <div class="absolute inset-x-0 top-5 border-t"></div>
      @for (tick of ticks(); track tick.time) {
        <div class="absolute top-px flex -translate-x-1/2 flex-col items-center gap-0.5"
             [style.left.%]="tick.position">
          <span class="text-xs leading-4 whitespace-nowrap tabular-nums"
                [class]="tick.major ? 'font-bold text-foreground' : 'font-medium text-muted-foreground'">
            {{ tick.label }}
          </span>
          <span class="w-px" [class]="tick.major ? 'h-5 bg-foreground/60' : 'h-3 bg-border'"></span>
        </div>
      }
      <div class="absolute inset-y-0 w-px bg-emerald-400/70" [style.left.%]="nowPosition()"></div>
      <div class="absolute inset-y-0 w-0.5 -translate-x-1/2 cursor-ew-resize bg-primary"
           [style.left.%]="handlePosition()">
        <span class="absolute top-5 left-1/2 size-4 -translate-1/2 rounded-full border-2 border-background bg-primary"></span>
      </div>
    </div>
    @if (isHandleInView()) {
      <div class="absolute bottom-full mb-3 -translate-x-1/2" [style.left.%]="labelPosition()">
        <button hlmBtn size="sm" dir="rtl" aria-label="חזרה לעכשיו"
                class="h-auto min-h-8 flex-col gap-0 py-1 text-sm font-medium tabular-nums shadow-[0_0_12px_rgb(0_0_0/0.45)]"
                [class.animate-pulse]="layers.isLoading()"
                [variant]="isLive() ? 'default' : 'secondary'" (click)="time.jumpToNow()">
          <span>{{ timeLabel() }}</span>
          @if (playingLine(); as line) {
            <span class="text-xs leading-4 font-normal opacity-80">{{ line }}</span>
          }
        </button>
        <span class="absolute top-full left-1/2 h-3 w-0.5 -translate-x-1/2 bg-primary"></span>
      </div>
    }
  </div>
</div>
